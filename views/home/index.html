<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Choices.js -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css" />

  <link rel="stylesheet" href="/teste/public/css/app.css">
  <link rel="stylesheet" href="/teste/public/css/home.css">
  <link rel="stylesheet" href="/teste/lib/rtimeline/css/rtimeline.css">
</head>

<body id="up">
  <!-- NAVBAR -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid d-flex justify-content-between">

      <!-- ESQUERDA -->
      <span class="navbar-brand mb-0">
        Sistema de Controle de Laminação
      </span>

      <!-- DIREITA -->
      <div class="d-flex align-items-center gap-3">
        <span id="usuario-logado" class="text-white small"></span>

        <button class="btn btn-outline-light btn-sm" onclick="logout()">
          <i class="fa-solid fa-door-open"></i>
        </button>
      </div>

    </div>
  </nav>

  <!-- LAYOUT -->
  <div class="container-fluid">
    <div class="row">

      <div class="col-lg-2 d-none d-lg-block sidebar p-3">
        <ul class="nav nav-pills flex-column">
          <li class="nav-item">
            <button class="nav-link active w-100 text-start" data-bs-toggle="tab" data-bs-target="#dashboard" onclick="carregarDashboard()">
              <i class="fa-solid fa-chart-line"></i> Dashboard
            </button>
          </li>
          <li class="nav-item">
            <button class="nav-link w-100 text-start" data-bs-toggle="tab" data-bs-target="#pedido" onclick="carregarPedido()">
              <i class="fa-solid fa-box"></i> Pedido
            </button>
          </li>
          <li class="nav-item">
            <button class="nav-link w-100 text-start" data-bs-toggle="tab" data-bs-target="#status" onclick="carregarStatus()">
              <i class="fa-solid fa-list-check"></i> Status
            </button>
          </li>
          <li class="nav-item">
            <button class="nav-link w-100 text-start" data-bs-toggle="tab" data-bs-target="#shaper" onclick="carregarShaper()">
              <i class="fa-solid fa-mask-face"></i> Shaper
            </button>
          </li>
        </ul>
      </div>

      <div class="col-lg-10 col-md-12 p-4">
        <div class="tab-content">
          <div class="tab-pane fade show active" id="dashboard">
            <div id="conteudo-dashboard"></div>
          </div>
          <div class="tab-pane fade" id="pedido">
            <div id="conteudo-pedido"></div>
          </div>
          <div class="tab-pane fade" id="status">
            <div id="conteudo-status"></div>
          </div>
          <div class="tab-pane fade" id="shaper">
            <div id="conteudo-shaper"></div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <nav class="d-lg-none fixed-bottom bg-white py-4 w-100 nav-bottom">
    <div class="container d-flex justify-content-center px-2">
      <ul class="nav nav-pills nav-fill">
        <li class="nav-item">
          <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#dashboard" onclick="carregarDashboard()">
            <i class="fa-solid fa-chart-line fa-lg"></i>
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link" data-bs-toggle="tab" data-bs-target="#pedido" onclick="carregarPedido()">
            <i class="fa-solid fa-rectangle-list fa-lg"></i>
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link" data-bs-toggle="tab" data-bs-target="#status" onclick="carregarStatus()">
            <i class="fa-solid fa-list-ol fa-lg"></i>
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link" data-bs-toggle="tab" data-bs-target="#shaper" onclick="carregarShaper()">
            <i class="fa-solid fa-mask-face fa-lg"></i>
          </button>
        </li>
      </ul>
    </div>
  </nav>


  <!-- TOAST GERAL ALERT-->
  <div class="toast-container position-fixed top-0 end-0 p-3">

    <div id="alertToast" class="toast align-items-center border-0" role="alert" aria-live="assertive" aria-atomic="true" data-bs-autohide="true" data-bs-delay="3000">

      <div class="d-flex">

        <div class="toast-body">
          <i class="fa-regular fa-bell"></i>
          <span id="toast-text"></span>
        </div>

        <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close">
        </button>

      </div>

    </div>

  </div>

  <!-- JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
  <script src="/teste/public/js/app.js"></script>
  <script src="/teste/public/js/home.js"></script>
  <script src="/teste/public/js/shaper.js"></script>
  <script src="/teste/public/js/pedido-status.js"></script>
  <script src="/teste/public/js/pedido.js"></script>
  <script src="/teste/public/js/status.js"></script>

</body>

</html>
