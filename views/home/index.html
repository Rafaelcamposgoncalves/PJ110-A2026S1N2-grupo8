<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <span class="navbar-brand">Sistema de Controle de Laminação</span>
      <button class="btn btn-outline-light btn-sm" onclick="logout()"><i class="fa-solid fa-door-open"></i></button>
    </div>
  </nav>

  <div class="container mt-4">

    <ul class="nav nav-tabs">
      <li class="nav-item">
        <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#pedido" onclick="carregarPedido()">
          <i class="fa-solid fa-clipboard-list"></i> Pedido
        </button>
      </li>

      <li class="nav-item">
        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#shaper" onclick="carregarShaper()">
          <i class="fa-solid fa-person"></i> Shaper
        </button>
      </li>
    </ul>

    <div class="tab-content p-4 border border-top-0">

      <div class="tab-pane fade show active" id="pedido">
        <div id="conteudo-pedido"></div>
      </div>

      <div class="tab-pane fade" id="shaper">
        <div id="conteudo-shaper"></div>
      </div>

    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>

    let pedidoCarregado = false;
    let shaperCarregado = false;

    async function carregarPedido() {

      if (pedidoCarregado) return;

      const response = await fetch("/teste/pedido");
      const html = await response.text();

      const container = document.getElementById("conteudo-pedido");
      container.innerHTML = html;

      executarScripts(container);

      pedidoCarregado = true;
    }

    async function carregarShaper() {

      if (shaperCarregado) return;

      const response = await fetch("/teste/shaper");
      const html = await response.text();

      const container = document.getElementById("conteudo-shaper");
      container.innerHTML = html;

      executarScripts(container);

      shaperCarregado = true;
    }

    function executarScripts(container) {

      const scripts = container.querySelectorAll("script");

      scripts.forEach(oldScript => {

        const newScript = document.createElement("script");

        if (oldScript.src) {
          newScript.src = oldScript.src;
        } else {
          newScript.textContent = oldScript.textContent;
        }

        document.body.appendChild(newScript);
      });
    }

    async function logout() {
      await fetch("/teste/api/logout", { method: "POST" });
      window.location.href = "/teste/login";
    }

    document.addEventListener("DOMContentLoaded", carregarPedido);

  </script>

</body>

</html>
