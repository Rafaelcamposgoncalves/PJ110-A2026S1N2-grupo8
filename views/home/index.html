<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      overflow-x: hidden;
    }

    .sidebar {
      min-height: 100vh;
      background: #212529;
    }

    .sidebar .nav-link {
      color: #ccc;
    }

    .sidebar .nav-link.active {
      background: #0d6efd;
      color: white;
    }

    .sidebar .nav-link:hover {
      background: #343a40;
      color: white;
    }
  </style>

</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">

      <span class="navbar-brand">
        Sistema de Controle de Laminação
      </span>

      <button class="btn btn-outline-light btn-sm" onclick="logout()">
        <i class="fa-solid fa-door-open"></i>
      </button>

    </div>
  </nav>

  <!-- LAYOUT -->
  <div class="container-fluid">

    <div class="row">

      <!-- SIDEBAR -->
      <div class="col-md-2 sidebar p-3">

        <ul class="nav nav-pills flex-column">

          <li class="nav-item">

            <button class="nav-link active w-100 text-start" data-bs-toggle="tab" data-bs-target="#pedido" onclick="carregarPedido()">

              <i class="fa-solid fa-rectangle-list"></i>
              Pedido

            </button>

          </li>

          <li class="nav-item">

            <button class="nav-link w-100 text-start" data-bs-toggle="tab" data-bs-target="#shaper" onclick="carregarShaper()">

              <i class="fa-solid fa-mask-face"></i>
              Shaper

            </button>

          </li>

        </ul>

      </div>

      <!-- CONTEÚDO -->
      <div class="col-md-10 p-4">

        <div class="tab-content">

          <div class="tab-pane fade show active" id="pedido">
            <div id="conteudo-pedido"></div>
          </div>

          <div class="tab-pane fade" id="shaper">
            <div id="conteudo-shaper"></div>
          </div>

        </div>

      </div>

    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>

    let pedidoCarregado = false;
    let shaperCarregado = false;

    async function carregarPedido() {

      if (pedidoCarregado) return;

      const response = await fetch("/teste/pedido");
      const html = await response.text();

      const container = document.getElementById("conteudo-pedido");
      container.innerHTML = html;

      executarScripts(container);

      pedidoCarregado = true;
    }

    async function carregarShaper() {

      if (shaperCarregado) return;

      const response = await fetch("/teste/shaper");
      const html = await response.text();

      const container = document.getElementById("conteudo-shaper");
      container.innerHTML = html;

      executarScripts(container);

      shaperCarregado = true;
    }

    function executarScripts(container) {

      const scripts = container.querySelectorAll("script");

      scripts.forEach(oldScript => {

        const newScript = document.createElement("script");

        if (oldScript.src) {
          newScript.src = oldScript.src;
        } else {
          newScript.textContent = oldScript.textContent;
        }

        document.body.appendChild(newScript);

      });
    }

    async function logout() {

      await fetch("/teste/api/logout", { method: "POST" });

      window.location.href = "/teste/login";
    }

    document.addEventListener("DOMContentLoaded", carregarPedido);

  </script>

</body>

</html>
