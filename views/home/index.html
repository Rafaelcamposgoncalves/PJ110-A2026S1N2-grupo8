<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Choices.js -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css" />

  <style>
    body {
      overflow-x: hidden;
    }

    @media (max-width: 991px) {
      body {
        padding-bottom: 70px;
      }
    }

    @media (min-width: 992px) {
      body {
        padding-bottom: 0;
      }
    }

    .sidebar {
      min-height: calc(100vh - 56px);
      background: #212529;
    }

    .sidebar .nav-link {
      color: #ccc;
    }

    .sidebar .nav-link.active {
      background: #0d6efd;
      color: white;
    }

    .sidebar .nav-link:hover {
      background: #343a40;
      color: white;
    }

    .choices {
      margin-bottom: 0;
      height: 32px;
      z-index: 2;
    }

    .choices__inner,
    .choices__input {
      background-color: #fff;
      height: 32px;
      z-index: 0;
    }

    .choices__inner {
      min-height: calc(1.5em + .5rem + 2px);
      padding: 0.3px .5rem;
      font-size: .875rem;
      border-radius: .25rem;
    }

    .choice_plus {
      top: 0px;
      right: 0px;
      z-index: 10;
      height: 100%;
      border-radius: 0px 4px 4px 0px;
    }

    .nav-bottom {
      box-shadow: 0 -4px 12px #eee;
    }
  </style>

  <link rel="stylesheet" href="/teste/css/rtimeline.css">
</head>

<body id="up">
  <!-- NAVBAR -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid d-flex justify-content-between">

      <!-- ESQUERDA -->
      <span class="navbar-brand mb-0">
        Sistema de Controle de Laminação
      </span>

      <!-- DIREITA -->
      <div class="d-flex align-items-center gap-3">
        <span id="usuario-logado" class="text-white small"></span>

        <button class="btn btn-outline-light btn-sm" onclick="logout()">
          <i class="fa-solid fa-door-open"></i>
        </button>
      </div>

    </div>
  </nav>

  <!-- LAYOUT -->
  <div class="container-fluid">
    <div class="row">

      <div class="col-lg-2 d-none d-lg-block sidebar p-3">
        <ul class="nav nav-pills flex-column">
          <li class="nav-item">
            <button class="nav-link active w-100 text-start" data-bs-toggle="tab" data-bs-target="#dashboard" onclick="carregarDashboard()">
              <i class="fa-solid fa-chart-line"></i> Dashboard
            </button>
          </li>
          <li class="nav-item">
            <button class="nav-link w-100 text-start" data-bs-toggle="tab" data-bs-target="#pedido" onclick="carregarPedido()">
              <i class="fa-solid fa-box"></i> Pedido
            </button>
          </li>
          <li class="nav-item">
            <button class="nav-link w-100 text-start" data-bs-toggle="tab" data-bs-target="#shaper" onclick="carregarShaper()">
              <i class="fa-solid fa-mask-face"></i> Shaper
            </button>
          </li>
        </ul>
      </div>

      <div class="col-lg-10 col-md-12 p-4">
        <div class="tab-content">
          <div class="tab-pane fade show active" id="dashboard">
            <div id="conteudo-dashboard"></div>
          </div>
          <div class="tab-pane fade" id="pedido">
            <div id="conteudo-pedido"></div>
          </div>
          <div class="tab-pane fade" id="shaper">
            <div id="conteudo-shaper"></div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <nav class="d-lg-none fixed-bottom bg-white py-4 w-100 nav-bottom">
    <div class="container d-flex justify-content-center px-2">
      <ul class="nav nav-pills nav-fill">
        <li class="nav-item">
          <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#dashboard" onclick="carregarDashboard()">
            <i class="fa-solid fa-chart-line fa-lg"></i>
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link" data-bs-toggle="tab" data-bs-target="#pedido" onclick="carregarPedido()">
            <i class="fa-solid fa-rectangle-list fa-lg"></i>
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link" data-bs-toggle="tab" data-bs-target="#shaper" onclick="carregarShaper()">
            <i class="fa-solid fa-mask-face fa-lg"></i>
          </button>
        </li>
      </ul>
    </div>
  </nav>

  <!-- JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>

  <script>
    let dashboardCarregado = false;
    let pedidoCarregado = false;
    let shaperCarregado = false;

    async function carregarUsuario() {
      try {
        const response = await fetch("/teste/api/usuario");
        const data = await response.json();

        if (data.nome) {
          document.getElementById("usuario-logado").innerHTML =
            '<i class="fa-solid fa-user"></i> ' + data.usuario + ' | ' + data.nome;
        }
      } catch (erro) {
        console.error("Erro ao carregar usuário:", erro);
      }
    }

    async function carregarDashboard() {
      if (dashboardCarregado) return;
      const response = await fetch("/teste/dashboard");
      const html = await response.text();
      const container = document.getElementById("conteudo-dashboard");
      container.innerHTML = html;
      executarScripts(container);
      dashboardCarregado = true;
    }

    async function carregarPedido() {
      if (pedidoCarregado) return;
      const response = await fetch("/teste/pedido");
      const html = await response.text();
      const container = document.getElementById("conteudo-pedido");
      container.innerHTML = html;
      executarScripts(container);
      pedidoCarregado = true;
    }

    async function carregarShaper() {
      if (shaperCarregado) return;
      const response = await fetch("/teste/shaper");
      const html = await response.text();
      const container = document.getElementById("conteudo-shaper");
      container.innerHTML = html;
      executarScripts(container);
      shaperCarregado = true;
    }

    function executarScripts(container) {
      const scripts = container.querySelectorAll("script");
      scripts.forEach(oldScript => {
        const newScript = document.createElement("script");
        if (oldScript.src) newScript.src = oldScript.src;
        else newScript.textContent = oldScript.textContent;
        document.body.appendChild(newScript);
      });
    }

    async function logout() {
      await fetch("/teste/api/logout", { method: "POST" });
      window.location.href = "/teste/login";
    }

    document.addEventListener("DOMContentLoaded", () => {
      carregarDashboard();
      carregarUsuario();
    });
  </script>
</body>

</html>
