<div class="container-fluid">
    <h4 class="mb-4"><i class="fa-solid fa-mask-face"></i> Shaper/Cliente</h4>
    <div id="alerta" class="alert d-none"></div>
    <div class="card mb-4 border-0">
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Nome</label>
                    <input type="text" id="nome" class="form-control form-control-sm">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Telefone</label>
                    <input type="text" id="telefone" class="form-control form-control-sm" placeholder="(00) 00000-0000" oninput="window.mascaraTelefone(this)">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Email</label>
                    <input type="email" id="email" class="form-control form-control-sm">
                </div>
                <div class="col-12">
                    <button id="btnSubmit" class="btn btn-sm btn-primary" onclick="window.cadastrarOuAtualizar()">
                        <i class="fa-solid fa-plus"></i> Cadastrar
                    </button>
                    <!-- Botão Cancelar com ID correto -->
                    <button id="btnCancelarShaper" class="btn btn-sm btn-outline-secondary d-none" onclick="window.resetForm()">
                        Cancelar
                    </button>
                </div>
            </div>
            <div class="input-group mt-3 mb-3">
                <input type="text" id="buscarTexto" class="form-control form-control-sm" placeholder="Buscar por ID, Nome, Telefone ou Email">
                <button class="btn btn-sm btn-outline-secondary border-secondary-subtle" onclick="window.buscarShaper()"><i class="fa-solid fa-magnifying-glass"></i></button>
                <button class="btn btn-sm btn-outline-secondary border-secondary-subtle" onclick="window.listarShapers()"><i class="fa-solid fa-xmark"></i></button>
            </div>
        </div>
    </div>
    <div class="table-responsive rounded-1">
        <table class="table table-striped table-bordered table-hover table-sm">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Telefone</th>
                    <th>Email</th>
                    <th class="text-center">Ativ/Desat</th>
                    <th width="100">Ações</th>
                </tr>
            </thead>
            <tbody id="lista"></tbody>
        </table>
    </div>
</div>

<!-- MODAL EXCLUIR SHAPER -->

<div class="modal fade" id="modalShaperExcluir" tabindex="-1">
    <div class="modal-dialog modal-md modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="fa-regular fa-trash-can"></i> Excluir Shaper
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <p>Tem certeza que deseja realmente excluir o Shaper?</p>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Não</button>
                <button type="button" class="btn btn-primary" id="btnConfirmarExcluirShaper">Sim</button>
            </div>

        </div>
    </div>
</div>
