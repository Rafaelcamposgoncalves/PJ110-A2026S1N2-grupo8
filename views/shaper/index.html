<div class="container-fluid">

    <h4 class="mb-4"><i class="fa-solid fa-mask-face"></i> Shaper</h4>

    <div id="alerta" class="alert d-none"></div>

    <div class="card mb-4 border-0">
        <div class="card-body">
            <div class="row g-3">

                <div class="col-md-4">
                    <label class="form-label">Nome</label>
                    <input type="text" id="nome" class="form-control form-control-sm">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Telefone</label>
                    <input type="text" id="telefone" class="form-control form-control-sm">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Email</label>
                    <input type="email" id="email" class="form-control form-control-sm">
                </div>

                <div class="col-12">
                    <button id="btnSubmit" class="btn btn-sm btn-primary" onclick="cadastrarOuAtualizar()">
                        <i class="fa-solid fa-plus"></i> Cadastrar
                    </button>
                </div>

            </div>
            <div class="input-group mt-3 mb-3">
                <input type="text" id="buscarTexto" class="form-control form-control-sm" placeholder="Buscar por ID, Nome, Telefone ou Email">
                <button class="btn btn-sm btn-outline-secondary border-secondary-subtle" onclick="buscarShaper()"><i class="fa-solid fa-magnifying-glass"></i></button>
                <button class="btn btn-sm btn-outline-secondary border-secondary-subtle" onclick="listarShapers()"><i class="fa-solid fa-xmark"></i></button>
            </div>
        </div>

    </div>

    <div class="table-responsive rounded-1">
        <table class="table table-striped table-hover table-sm">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Telefone</th>
                    <th>Email</th>
                    <th width="100">Ações</th>
                </tr>
            </thead>
            <tbody id="lista"></tbody>
        </table>
    </div>
</div>
