<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>CRUD Clientes</title>

<style>
body { font-family: Arial; margin: 40px; }
input { padding: 8px; margin: 5px 0; width: 250px; }
button { padding: 8px 12px; cursor: pointer; margin-top: 5px; }
.card { border: 1px solid #ccc; padding: 10px; margin: 10px 0; }
.delete-btn { background: red; color: white; border: none; }
</style>
</head>
<body>

<h1>Clientes</h1>

<h2>Cadastrar Cliente</h2>
<input type="text" id="nome" placeholder="Nome">
<input type="text" id="telefone" placeholder="Telefone">
<input type="email" id="email" placeholder="Email">
<br>
<button onclick="cadastrarCliente()">Cadastrar</button>

<hr>

<h2>Buscar Cliente por ID</h2>
<input type="number" id="buscarId" placeholder="ID">
<button onclick="buscarCliente()">Buscar</button>

<hr>

<h2>Lista de Clientes</h2>
<button onclick="listarClientes()">Atualizar Lista</button>

<div id="lista"></div>

<script>

const BASE_URL = window.location.origin + "/teste";

function apiUrl(recurso, id = null) {
    if (id) {
        return `${BASE_URL}/index.php?recurso=${recurso}&id=${id}`;
    }
    return `${BASE_URL}/index.php?recurso=${recurso}`;
}

/* LISTAR */
async function listarClientes() {
    const response = await fetch(apiUrl("clientes"));
    const data = await response.json();

    const lista = document.getElementById("lista");
    lista.innerHTML = "";

    if (!data || data.length === 0) {
        lista.innerHTML = "<p>Nenhum cliente encontrado.</p>";
        return;
    }

    data.forEach(cliente => {
        lista.innerHTML += `
            <div class="card">
                <strong>ID:</strong> ${cliente.id}<br>
                <strong>Nome:</strong> ${cliente.nome}<br>
                <strong>Telefone:</strong> ${cliente.telefone}<br>
                <strong>Email:</strong> ${cliente.email}<br>
                <button class="delete-btn" onclick="deletarCliente(${cliente.id})">
                    Deletar
                </button>
            </div>
        `;
    });
}

/* CADASTRAR */
async function cadastrarCliente() {

    const nome = document.getElementById("nome").value;
    const telefone = document.getElementById("telefone").value;
    const email = document.getElementById("email").value;

    if (!nome || !telefone || !email) {
        alert("Preencha todos os campos!");
        return;
    }

    const response = await fetch(apiUrl("clientes"), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nome, telefone, email })
    });

    const data = await response.json();

    alert(data.mensagem);

    listarClientes();
}

/* BUSCAR */
async function buscarCliente() {

    const id = document.getElementById("buscarId").value;

    if (!id) {
        alert("Digite um ID!");
        return;
    }

    const response = await fetch(apiUrl("clientes", id));
    const data = await response.json();

    const lista = document.getElementById("lista");
    lista.innerHTML = "";

    if (!data || data.erro) {
        lista.innerHTML = "<p>Cliente não encontrado.</p>";
        return;
    }

    lista.innerHTML = `
        <div class="card">
            <strong>ID:</strong> ${data.id}<br>
            <strong>Nome:</strong> ${data.nome}<br>
            <strong>Telefone:</strong> ${data.telefone}<br>
            <strong>Email:</strong> ${data.email}<br>
            <button class="delete-btn" onclick="deletarCliente(${data.id})">
                Deletar
            </button>
        </div>
    `;
}

/* DELETAR */
async function deletarCliente(id) {

    if (!confirm("Tem certeza que deseja deletar este cliente?")) {
        return;
    }

    const response = await fetch(apiUrl("clientes", id), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ _method: "DELETE" })
    });

    const data = await response.json();

    alert(data.mensagem);

    listarClientes();
}

listarClientes();

</script>
</body>
</html>
