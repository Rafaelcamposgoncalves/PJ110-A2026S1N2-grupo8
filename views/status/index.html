<div class="container-fluid">
  <h4 class="mb-4"><i class="fa-solid fa-list-check"></i> Status</h4>
  <div id="alerta-status" class="alert d-none"></div>
  <div class="card mb-4 border-0">
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md">
          <label class="form-label">Descrição</label>
          <input id="descricao" class="form-control form-control-sm">
          <input id="ordem" type="hidden">
        </div>
        <div class="col-12">
          <button id="btnSubmitStatus" class="btn btn-sm btn-primary" onclick="window.salvarCadastroStatus()">
            <i class="fa-solid fa-plus"></i> Cadastrar
          </button>
          <button id="btnCancelarEdicao" class="btn btn-sm btn-outline-secondary d-none" onclick="window.cancelarEdicaoStatus()">
            Cancelar
          </button>
        </div>
      </div>
      <div class="input-group mt-3 mb-3">
        <input type="text" id="buscarStatus" class="form-control form-control-sm" placeholder="Buscar por ID ou Descrição">
        <button class="btn btn-sm btn-outline-secondary" onclick="window.buscarStatus()"><i class="fa-solid fa-magnifying-glass"></i></button>
        <button class="btn btn-sm btn-outline-secondary" onclick="window.listarStatus()"><i class="fa-solid fa-xmark"></i></button>
      </div>
    </div>
  </div>

  <div class="alert alert-info py-2" style="font-size: 0.85rem;">
    <i class="fa-solid fa-grip-vertical me-2"></i> Arraste os itens para reordenar a sequência do fluxo.
  </div>

  <div class="table-responsive rounded-1">
    <table class="table table-striped table-bordered table-hover table-sm">
      <thead class="table-dark">
        <tr>
          <th width="50"></th>
          <th>Descrição</th>
          <th width="100" class="text-center">Ativo</th>
          <th width="120" class="text-center">Ações</th>
        </tr>
      </thead>
      <tbody id="lista-status"></tbody>
    </table>
  </div>
</div>



<div class="modal fade" id="modalStatusExcluirBase" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="fa-regular fa-trash-can"></i> Excluir Status</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p>Tem certeza que deseja realmente excluir este Status?</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Não</button>
        <button type="button" class="btn btn-primary" id="btnConfirmarExcluirStatus">Sim</button>
      </div>
    </div>
  </div>
</div>
