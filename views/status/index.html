<div class="container-fluid">

  <h4 class="mb-4">
    <i class="fa-solid fa-list-check"></i> Status
  </h4>

  <div id="alerta-status" class="alert d-none"></div>

  <div class="card mb-4 border-0">
    <div class="card-body">

      <div class="row g-3">

        <div class="col-md-7">
          <label class="form-label">Descrição</label>
          <input id="descricao" class="form-control form-control-sm">
        </div>

        <div class="col-md-5">
          <label class="form-label">Ordem</label>
          <input id="ordem" type="number" class="form-control form-control-sm">
        </div>

        <div class="col-12">
          <button id="btnSubmitStatus" class="btn btn-sm btn-primary" onclick="salvarCadastroStatus()">
            <i class="fa-solid fa-plus"></i> Cadastrar
          </button>
        </div>

      </div>


      <div class="input-group mt-3 mb-3">
        <input type="text" id="buscarStatus" class="form-control form-control-sm" placeholder="Buscar por ID ou Descrição">
        <button class="btn btn-sm btn-outline-secondary border-secondary-subtle" onclick="buscarStatus()">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
        <button class="btn btn-sm btn-outline-secondary border-secondary-subtle" onclick="listarStatus()">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

    </div>
  </div>

  <div class="table-responsive rounded-1">
    <table class="table table-striped table-hover table-sm">
      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Descrição</th>
          <th>Ordem</th>
          <th width="120">Ações</th>
        </tr>
      </thead>
      <tbody id="lista-status"></tbody>
    </table>
  </div>

</div>
