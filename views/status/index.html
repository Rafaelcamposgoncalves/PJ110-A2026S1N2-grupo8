<h4>Status</h4>

<div class="mb-3">
  <input id="descricao" class="form-control mb-2" placeholder="Descrição">
  <input id="ordem" type="number" class="form-control mb-2" placeholder="Ordem">

  <button onclick="salvarStatus()" class="btn btn-primary">
    Salvar
  </button>
</div>

<table class="table table-sm">
  <thead>
    <tr>
      <th>ID</th>
      <th>Descrição</th>
      <th>Ordem</th>
      <th>Ações</th>
    </tr>
  </thead>
  <tbody id="lista-status"></tbody>
</table>
