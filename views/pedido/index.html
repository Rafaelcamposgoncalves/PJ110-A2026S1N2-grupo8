                    <div class="card-body">

                            <div class="col-md-3">

                                    <button class="btn btn-outline-secondary" type="button" onclick="abrirModalGenerico('acabamento')">

                            </div>

                            <!-- CONFIG QUILHA -->
                            <div class="col-md-3">
                                <label class="form-label">Config. Quilha</label>

                                    <select id="id_configuracaoquilhaPedido" class="form-control"></select>
                                    <button class="btn btn-outline-secondary" type="button" onclick="abrirModalGenerico('configQuilha')">

                                    </button>

                            </div>

                            <!-- SISTEMA QUILHA -->
                            <div class="col-md-3">
                                <label class="form-label">Sistema Quilha</label>

            <div class="table-responsive rounded-1">

<!-- MODAL GERENCIADOR -->

    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Gerenciar Composição</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">

                <!-- FORM -->
                <div class="row g-2 mb-3">
                    <div class="col">
                        <input type="text" id="modalInput" class="form-control form-control-sm" placeholder="Digite a composição">
                    </div>
                    <div class="col-auto">
                        <div class="col-auto">
                            <button id="btnSalvarComposicao" class="btn btn-sm btn-primary" onclick="salvarComposicao()">

                        <tbody id="listaComposicoesModal"></tbody>
                    </table>
                </div>

            </div>

        </div>
    </div>
</div>

<!-- Script -->

<script>
    // ===============================
    // CONTROLE GLOBAL
    // ===============================
    let contextoAtual = null;
    let editIdGenerico = null;

    // ===============================
    // CONFIG DOS CAMPOS
    // ===============================
    const modalConfigs = {
        composicao: {
            icon: "<i class=\"fa-solid fa-flask\"></i>",
            titulo: "Gerenciar Composição",
            label: "Composição",
            selectId: "id_composicaoPedido",
            recurso: "composicoes"
        },
        variacao: {
            icon: "<i class=\"fa-solid fa-sliders\"></i>",
            titulo: "Gerenciar Variação",
            label: "Variação",
            selectId: "id_variacaoPedido",
            recurso: "variacoes"
        },
        acabamento: {
            icon: "<i class=\"fa-solid fa-brush\"></i>",
            titulo: "Gerenciar Acabamento",
            label: "Acabamento",
            selectId: "id_acabamentoPedido",
            recurso: "acabamentos"
        },
        configQuilha: {
            icon: "<i class=\"fa-solid fa-sliders\"></i></i>",
            titulo: "Gerenciar Config. Quilha",
            label: "Configuração de Quilha",
            selectId: "id_configuracaoquilhaPedido",
            recurso: "configuracaoquilhas"
        },
        sistemaQuilha: {
            icon: "<i class=\"fa-solid fa-sitemap\"></i></i>",
            titulo: "Gerenciar Sistema Quilha",
            label: "Sistema de Quilha",
            selectId: "id_sistemaquilhaPedido",
            recurso: "sistemaquilhas"
        },
        cores: {
            icon: "<i class=\"fa-solid fa-fill-drip\"></i>",
            titulo: "Gerenciar Cores",
            label: "Cor",
            selectId: "id_cor",
            recurso: "cores"
        },
        tecido: {
            icon: "<i class=\"fa-solid fa-layer-group\"></i>",
            titulo: "Gerenciar Tecidos",
            label: "Tecido",
            selectId: "id_tecidoPedido",
            recurso: "tecidos"
        }
    };

    // ===============================
    // ABRIR MODAL
    // ===============================
    function abrirModalGenerico(tipo) {

        contextoAtual = modalConfigs[tipo];
        editIdGenerico = null;

        document.querySelector("#modalGenerico .modal-title").innerHTML = contextoAtual.icon + " " + contextoAtual.titulo;

        const input = document.getElementById("modalInput");
        input.value = "";
        input.placeholder = contextoAtual.label;

        resetModalState();

        carregarListaModal();

        const modal = new bootstrap.Modal(document.getElementById('modalGenerico'));
        modal.show();
    }

    // ===============================
    // LISTAR
    // ===============================
    async function carregarListaModal() {

        const response = await fetch(`${BASE_URL}/api/${contextoAtual.recurso}`);
        const data = await response.json();

        const lista = document.getElementById("listaComposicoesModal");
        lista.innerHTML = "";

        data.forEach(item => {

            const id = item.id || Object.values(item)[0];
            const descricao = item.descricao || item.nome;

            lista.innerHTML += `
            <tr>
                <td>${id}</td>
                <td>${descricao}</td>
                <td>
                    <div class="btn-group">
                        <button class="btn btn-sm btn-outline-secondary" onclick="editarItem(${id}, '${descricao}')">
                            <i class="fa-solid fa-pen"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-secondary" onclick="deletarItem(${id})">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                </td>
            </tr>
        `;
        });
    }

    // ===============================
    // SALVAR / EDITAR
    // ===============================
    async function salvarComposicao() {

        const valor = document.getElementById("modalInput").value.trim();

        if (!valor) {
            alert("Digite algo");
            return;
        }

        let url = `${BASE_URL}/api/${contextoAtual.recurso}`;
        let body = { descricao: valor };

        if (editIdGenerico) {
            body._method = "PUT";
            url = `${BASE_URL}/api/${contextoAtual.recurso}/${editIdGenerico}`;
        }

        const response = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body)
        });

        const data = await response.json();

        if (!response.ok) {
            alert(data.erro);
            return;
        }

        resetModalState();

        carregarListaModal();
        popularSelects();
    }

    // ===============================
    // EDITAR
    // ===============================
    function editarItem(id, descricao) {

        editIdGenerico = id;

        document.getElementById("modalInput").value = descricao;

        const btnSalvar = document.getElementById("btnSalvarComposicao");
        const btnCancelar = document.getElementById("btnCancelarComposicao");

        btnSalvar.textContent = "Editar";
        btnSalvar.classList.remove("btn-primary");
        btnSalvar.classList.add("btn-warning");

        btnCancelar.classList.remove("d-none");
    }

    // ===============================
    // EXCLUIR
    // ===============================
    async function deletarItem(id) {

        if (!confirm("Excluir este item?")) return;

        const response = await fetch(`${BASE_URL}/api/${contextoAtual.recurso}/${id}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ _method: "DELETE" })
        });

        const data = await response.json();

        if (!response.ok) {
            alert(data.erro);
            return;
        }

        carregarListaModal();
        popularSelects();
    }

    // ===============================
    // CANCELAR / RESET
    // ===============================
    function cancelarEdicaoComposicao() {
        resetModalState();
    }

    function resetModalState() {

        editIdGenerico = null;

        document.getElementById("modalInput").value = "";

        const btnSalvar = document.getElementById("btnSalvarComposicao");
        const btnCancelar = document.getElementById("btnCancelarComposicao");

        btnSalvar.innerHTML = "<i class=\"fa-solid fa-plus\"></i> Cadastrar";
        btnSalvar.classList.remove("btn-warning");
        btnSalvar.classList.add("btn-primary");

        btnCancelar.classList.add("d-none");
    }









    window.excluirSelecionado = async function (tipo) {

        const map = {
            composicao: "id_composicaoPedido",
            variacao: "id_variacaoPedido",
            acabamento: "id_acabamentoPedido",
            configQuilha: "id_configuracaoquilhaPedido",
            sistemaQuilha: "id_sistemaquilhaPedido",
            cores: "id_cor",
            tecido: "id_tecidoPedido"
        };

        const recursoMap = {
            composicao: "composicoes",
            variacao: "variacoes",
            acabamento: "acabamentos",
            configQuilha: "configuracaoquilhas",
            sistemaQuilha: "sistemaquilhas",
            cores: "cores",
            tecido: "tecidos"
        };

        const select = document.getElementById(map[tipo]);
        const id = select.value;

        if (!id) {
            alert("Selecione um item para excluir");
            return;
        }

        if (!confirm("Tem certeza que deseja excluir este item?")) return;

        try {

            const response = await fetch(`${BASE_URL}/api/${recursoMap[tipo]}/${id}`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ _method: "DELETE" })
            });

            const data = await response.json();

            if (!response.ok) {
                alert(data.erro || "Erro ao excluir");
                return;
            }

            alert("Excluído com sucesso");

            // recarrega lista
            popularSelects();

        } catch (err) {
            console.error(err);
            alert("Erro de conexão");
        }
    };
    console.log("VALOR:", valor);
</script>



<script>


    function abrirShaper() {

        // força recarregar
        if (typeof carregarShaper === "function") {
            shaperCarregado = false;
            carregarShaper().then(() => {

                // 🔥 FORÇA LISTAR SHAPERS
                if (typeof listarShapers === "function") {
                    listarShapers();
                }

            });
        }

        const triggerEl = document.querySelector('[data-bs-target="#shaper"]');

        if (triggerEl) {
            const tab = new bootstrap.Tab(triggerEl);
            tab.show();
        }
    }

    document.addEventListener("input", function (e) {
        if (e.target.classList.contains("is-invalid")) {
            e.target.classList.remove("is-invalid");
        }
    });

    document.addEventListener("change", function (e) {
        if (e.target.classList.contains("is-invalid")) {
            e.target.classList.remove("is-invalid");
        }
    });

    if (!window.PEDIDO_MODULE_LOADED) {

        window.PEDIDO_MODULE_LOADED = true;

        window.editIdPedido = null;

        let tecidosChoice;
        let coresChoice;

        window.BASE_URL = window.location.origin + "/teste";

        function apiUrlPedido(recurso, id = null) {
            if (id) return `${window.BASE_URL}/api/${recurso}/${id}`;
            return `${window.BASE_URL}/api/${recurso}`;
        }

        function mostrarAlertaPedido(msg, tipo = "success") {

            const alerta = document.getElementById("alertaPedido");

            alerta.className = `alert alert-${tipo}`;

            alerta.innerHTML = msg;

            alerta.classList.remove("d-none");

            setTimeout(() => alerta.classList.add("d-none"), 4000);

        }

        window.popularSelects = async function () {

            await carregarSelect("id_shaperPedido", "shapers", "id_shaper", "nome");
            await carregarSelect("id_composicaoPedido", "composicoes", "id_composicao", "descricao");
            await carregarSelect("id_variacaoPedido", "variacoes", "id_variacao", "descricao");
            await carregarSelect("id_acabamentoPedido", "acabamentos", "id_acabamento", "descricao");
            await carregarSelect("id_tecidoPedido", "tecidos", "id_tecido", "descricao");
            await carregarSelect("id_configuracaoquilhaPedido", "configuracaoquilhas", "id_configuracaoquilha", "descricao");
            await carregarSelect("id_sistemaquilhaPedido", "sistemaquilhas", "id_sistemaquilha", "descricao");
            await carregarSelect("id_cor", "cores", "id_cor", "descricao");

            if (tecidosChoice) tecidosChoice.destroy();
            tecidosChoice = new Choices('#id_tecidoPedido', {
                removeItemButton: true,
                searchEnabled: true,
                placeholder: true,
                placeholderValue: 'Selecione...',
                itemSelectText: ''
            });

            if (coresChoice) coresChoice.destroy();
            coresChoice = new Choices('#id_cor', {
                removeItemButton: true,
                searchEnabled: true,
                placeholder: true,
                placeholderValue: 'Selecione...',
                itemSelectText: ''
            });

        }

        async function carregarSelect(selectId, recurso, idCampo, textoCampo) {

            const response = await fetch(apiUrlPedido(recurso));
            const data = await response.json();

            const select = document.getElementById(selectId);

            select.innerHTML = "";

            const optionDefault = document.createElement("option");

            optionDefault.value = "";
            optionDefault.textContent = "Selecione...";
            optionDefault.disabled = true;
            optionDefault.selected = true;

            select.appendChild(optionDefault);

            data.forEach(item => {

                const option = document.createElement("option");

                option.value = item[idCampo] ?? item.id;
                option.textContent = item[textoCampo] ?? item.nome ?? item.descricao;

                select.appendChild(option);

            });

        }

        window.listarPedidos = async function () {

            const response = await fetch(apiUrlPedido("pedidos"));
            const data = await response.json();

            const lista = document.getElementById("listaPedidos");

            lista.innerHTML = "";

            data.forEach(pedido => {

                lista.innerHTML += `
                    <tr>
                    <td>${pedido.id_pedido}</td>
                    <td>${pedido.data}</td>
                    <td>${pedido.shaper}</td>
                    <td>${pedido.observacao ?? ''}</td>

                    <td>
                    <button class="btn btn-sm btn-warning" onclick="preencherEdicaoPedido(${pedido.id_pedido})">
                    <i class="fa-solid fa-file-pen"></i>
                    </button>

                    <button class="btn btn-sm btn-danger" onclick="deletarPedido(${pedido.id_pedido})">
                    <i class="fa-solid fa-trash-can"></i>
                    </button>
                    </td>

                    </tr>
                    `;
            });
        }

        window.listarPedidosStatus = async function () {

            const response = await fetch(apiUrlPedido("pedidos"));
            const data = await response.json();
            //console.log(data);

            const lista = document.getElementById("accordionPanelsStayOpenExample");
            lista.innerHTML = "";

            data.forEach(pedido => {

                // timeline como string
                let timelineHTML = '<div class="timeline">';

                if (pedido.status) {

                    // separar status e datas
                    const statusArr = pedido.status.split(",").map(s => s.trim()).reverse();
                    const datasArr = (pedido.datas_status ?? "").split(",").map(d => d.trim()).reverse();
                    const observacoesArr = (pedido.observacoes_status ?? "")
                        .split(",")
                        .map(o => o.trim())
                        .reverse();


                    statusArr.forEach((s, i) => {
                        timelineHTML += `

            <div class="rtimeline">
                <div class="row">
                    <div class="col-auto d-none d-md-block">
                        <span class="badge rounded-pill text-bg-light">${datasArr[i] ?? ""}</span>
                    </div>
                    <div class="col-auto circle">
                        <div></div>
                    </div>
                    <div class="col-auto icon">
                        <i class="fa-solid fa-ellipsis"></i>
                    </div>
                    <div class="col col-lg-6">
                        <div class="card text-bg-light shadow-sm">
                            <div class="card-body">
                                <h6 class="card-subtitle mb-2 text-body-secondary float-sm-end d-md-none">${datasArr[i] ?? ""}</h6>
                                <h5 class="card-title">${s}</h5>
                                <p class="card-text">${observacoesArr[i] ?? ""}</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-auto">
                        <div class="btn-group btn-group-sm">
                            <button class="btn btn-outline-secondary btn-sm" onclick="editarStatus(${pedido.id_pedido}, ${i})">
                                <i class="fa-solid fa-pen"></i>
                            </button>

                            <button class="btn btn-outline-secondary btn-sm" onclick="excluirStatus(${pedido.id_pedido}, ${i})">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </div>

                </div>
            </div> <!--timeline end-->
            `;
                    });



                } else {
                    timelineHTML += `
            <div class="timeline-item">
                <div class="timeline-date">
                    <span class="text-muted">—</span>
                </div>
                <div class="timeline-line">
                    <div class="timeline-marker"></div>
                </div>
                <div class="timeline-content text-muted">Sem status</div>
            </div>
            `;
                }

                timelineHTML += '</div>';

                // extrair o último usuário da lista usuarios_status (se existir)
                const usuariosArray = pedido.usuarios_status ? pedido.usuarios_status.split(",").map(u => u.trim()) : [];
                const ultimoUsuario = usuariosArray.length > 0 ? usuariosArray[0] : ""; // mais recente primeiro

                // inserir no accordion
                lista.innerHTML += `
        <div class="accordion-item">
            <h2 class="accordion-header">
                <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#panelsStayOpen-collapse${pedido.id_pedido}" aria-expanded="true" aria-controls="panelsStayOpen-collapse${pedido.id_pedido}">
                    <div class="container-fluid">
                        <div class="row align-items-center">
                            <div class="col">
                                ${pedido.id_pedido} - ${pedido.shaper} 
                                ${ultimoUsuario ? `<small class="text-muted ms-2">(${ultimoUsuario})</small>` : ''}
                            </div>                      
                            <div class="col-auto">                      
                                <span class="badge rounded-pill text-bg-info">${pedido.data}</span>
                            </div>
                        </div>
                    </div>
                </button>
            </h2>
            <div id="panelsStayOpen-collapse${pedido.id_pedido}" class="accordion-collapse collapse">
                <div class="accordion-body">
                    <div class="text-end">
                        <button class="btn btn-primary btn-sm">
                            <i class="fa-solid fa-add"></i> Adicionar Status
                        </button>    
                    </div>                    
                    ${timelineHTML}
                </div>
            </div>
        </div>
        `;
            });
        }

        window.cadastrarOuAtualizarPedido = async function () {

            const camposObrigatorios = [
                { id: "dataPedido", nome: "Data" },
                { id: "id_shaperPedido", nome: "Shaper" },
                { id: "id_composicaoPedido", nome: "Composição" },
                { id: "id_variacaoPedido", nome: "Variação" },
                { id: "id_acabamentoPedido", nome: "Acabamento" },
                { id: "id_configuracaoquilhaPedido", nome: "Config. Quilha" },
                { id: "id_sistemaquilhaPedido", nome: "Sistema Quilha" }
            ];

            let camposFaltando = [];

            camposObrigatorios.forEach(campo => {

                const el = document.getElementById(campo.id);

                if (!el.value) {
                    camposFaltando.push(campo.nome);
                }

            });

            const cores = coresChoice.getValue(true);
            const tecidos = tecidosChoice.getValue(true);

            if (cores.length === 0) {
                camposFaltando.push("Cores");
            }

            if (tecidos.length === 0) {
                camposFaltando.push("Tecido");
            }

            if (camposFaltando.length > 0) {

                mostrarAlertaPedido(
                    "<b>Preencha os seguintes campos:</b><br><span class='badge rounded-pill text-bg-light border secondary-subtle'>" + camposFaltando.join("</span> <span class='badge rounded-pill text-bg-light border secondary-subtle'>"),
                    "danger"
                );

                return;

            }

            const bodyData = {

                data: document.getElementById("dataPedido").value,
                id_shaper: document.getElementById("id_shaperPedido").value,
                id_composicao: document.getElementById("id_composicaoPedido").value,
                id_variacao: document.getElementById("id_variacaoPedido").value,
                id_acabamento: document.getElementById("id_acabamentoPedido").value,
                id_configuracaoquilha: document.getElementById("id_configuracaoquilhaPedido").value,
                id_sistemaquilha: document.getElementById("id_sistemaquilhaPedido").value,
                observacao: document.getElementById("observacaoPedido").value,
                tecidos: tecidos,
                cores: cores

            };

            let url = apiUrlPedido("pedidos");

            if (window.editIdPedido) {

                bodyData._method = "PUT";
                url = apiUrlPedido("pedidos", window.editIdPedido);

            }

            const response = await fetch(url, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(bodyData)
            });

            const data = await response.json();

            mostrarAlertaPedido(data.mensagem || data.erro || "Erro inesperado", response.ok ? "success" : "danger");

            console.log(data);

            listarPedidos();

        }

        window.preencherEdicaoPedido = async function (id) {

            const response = await fetch(apiUrlPedido("pedidos", id));
            const pedido = await response.json();

            window.editIdPedido = pedido.id_pedido;

            document.getElementById("dataPedido").value = pedido.data;
            document.getElementById("id_shaperPedido").value = pedido.id_shaper;
            document.getElementById("id_composicaoPedido").value = pedido.id_composicao;
            document.getElementById("id_variacaoPedido").value = pedido.id_variacao;
            document.getElementById("id_acabamentoPedido").value = pedido.id_acabamento;
            document.getElementById("id_configuracaoquilhaPedido").value = pedido.id_configuracaoquilha;
            document.getElementById("id_sistemaquilhaPedido").value = pedido.id_sistemaquilha;
            document.getElementById("observacaoPedido").value = pedido.observacao;

            tecidosChoice.removeActiveItems();
            coresChoice.removeActiveItems();

            if (pedido.tecidos_ids) {
                const tecidos = pedido.tecidos_ids.split(",");
                tecidosChoice.setChoiceByValue(tecidos);
            }

            if (pedido.cores_ids) {
                const cores = pedido.cores_ids.split(",");
                coresChoice.setChoiceByValue(cores);
            }

            document.getElementById("btnSubmitPedido").textContent = "Atualizar";
            document.getElementById("btnCancelarPedido").classList.remove("d-none");

            document.getElementById("up").scrollIntoView({
                behavior: "smooth",
                block: "start"
            });

        }

        window.cancelarEdicaoPedido = function () {
            resetFormPedido();
        }

        window.deletarPedido = async function (id) {

            if (!confirm("Deseja realmente excluir este pedido?")) return;

            const response = await fetch(apiUrlPedido("pedidos", id), {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ _method: "DELETE" })
            });

            const data = await response.json();

            mostrarAlertaPedido(
                data.mensagem || data.erro || "Erro ao excluir",
                response.ok ? "success" : "danger"
            );

            listarPedidos();

        }

        window.resetFormPedido = function () {

            window.editIdPedido = null;

            document.getElementById("dataPedido").value = "";
            document.getElementById("observacaoPedido").value = "";

            document.getElementById("id_shaperPedido").selectedIndex = 0;
            document.getElementById("id_composicaoPedido").selectedIndex = 0;
            document.getElementById("id_variacaoPedido").selectedIndex = 0;
            document.getElementById("id_acabamentoPedido").selectedIndex = 0;
            document.getElementById("id_configuracaoquilhaPedido").selectedIndex = 0;
            document.getElementById("id_sistemaquilhaPedido").selectedIndex = 0;

            tecidosChoice.removeActiveItems();
            coresChoice.removeActiveItems();

            document.getElementById("btnSubmitPedido").textContent = "Cadastrar";
            document.getElementById("btnCancelarPedido").classList.add("d-none");

        }

        listarPedidos();
        listarPedidosStatus();
        popularSelects();

    }

</script>
