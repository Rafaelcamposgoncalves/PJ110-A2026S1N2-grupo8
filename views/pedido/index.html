<div class="container-fluid">

    <h4 class="mb-4"><i class="fa-solid fa-box"></i> Pedido</h4>

    <ul class="nav nav-tabs">

        <li class="nav-item">
            <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tabPedidoStatus">
                <i class="fa-solid fa-arrows-turn-to-dots"></i>
                <!-- Mobile -->
                <span class="d-inline d-md-none"> Status</span>
                <!-- Desktop -->
                <span class="d-none d-md-inline"> Status do Pedido</span>
            </button>
        </li>

        <li class="nav-item">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabGerenciamentoPedido">
                <i class="fa-solid fa-gears"></i>
                <!-- Mobile -->
                <span class="d-inline d-md-none"> Gerenciamento</span>
                <!-- Desktop -->
                <span class="d-none d-md-inline"> Gerenciamento de Pedido</span>
            </button>
        </li>

    </ul>

    <div class="tab-content pt-3">
        <!-- STATUS -->
        <div class="tab-pane fade show active" id="tabPedidoStatus">
            <div class="container-fluid">
                <div class="accordion accordion-flush" id="accordionPanelsStayOpenExample">

                </div>
            </div>
        </div>

        <!-- GERENCIAMENTO -->
        <div class="tab-pane fade" id="tabGerenciamentoPedido">

            <div class="container-fluid">

                <div id="alertaPedido" class="alert d-none"></div>

                <div class="card mb-4 border-0">

                    <div class="card-body">

                        <div class="row g-3">

                            <div class="col-md-4">
                                <label class="form-label">Data</label>
                                <input type="date" id="dataPedido" class="form-control form-control-sm">
                            </div>

                            <div class="col-md-5">
                                <label class="form-label">Shaper</label>
                                <div class="input-group input-group-sm mb-3">
                                    <select id="id_shaperPedido" class="form-control">
                                    </select>
                                    <button class="btn btn-outline-secondary" type="button" onclick="abrirShaper()">
                                        <i class="fa-solid fa-gear"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- COMPOSIÇÃO -->
                            <div class="col-md-3">
                                <label class="form-label">Composição</label>
                                <div class="input-group input-group-sm mb-3">
                                    <select id="id_composicaoPedido" class="form-control"></select>
                                    <button class="btn btn-outline-secondary" type="button" onclick="abrirModalGenerico('composicao')">
                                        <i class="fa-solid fa-gear"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- VARIAÇÃO -->
                            <div class="col-md-3">
                                <label class="form-label">Variação</label>
                                <div class="input-group input-group-sm mb-3">
                                    <select id="id_variacaoPedido" class="form-control"></select>
                                    <button class="btn btn-outline-secondary" type="button" onclick="abrirModalGenerico('variacao')">
                                        <i class="fa-solid fa-gear"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- ACABAMENTO -->
                            <div class="col-md-3">
                                <label class="form-label">Acabamento</label>
                                <div class="input-group input-group-sm mb-3">
                                    <select id="id_acabamentoPedido" class="form-control"></select>
                                    <button class="btn btn-outline-secondary" type="button" onclick="abrirModalGenerico('acabamento')">
                                        <i class="fa-solid fa-gear"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- CONFIG QUILHA -->
                            <div class="col-md-3">
                                <label class="form-label">Config. Quilha</label>
                                <div class="input-group input-group-sm mb-3">
                                    <select id="id_configuracaoquilhaPedido" class="form-control"></select>
                                    <button class="btn btn-outline-secondary" type="button" onclick="abrirModalGenerico('configQuilha')">
                                        <i class="fa-solid fa-gear"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- SISTEMA QUILHA -->
                            <div class="col-md-3">
                                <label class="form-label">Sistema Quilha</label>
                                <div class="input-group input-group-sm mb-3">
                                    <select id="id_sistemaquilhaPedido" class="form-control"></select>
                                    <button class="btn btn-outline-secondary" type="button" onclick="abrirModalGenerico('sistemaQuilha')">
                                        <i class="fa-solid fa-gear"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- CORES -->
                            <div class="col-md-6">
                                <label class="form-label">Cores</label>
                                <div class="position-relative">
                                    <select id="id_cor" multiple></select>
                                    <button class="btn btn-outline-secondary btn-sm position-absolute choice_plus" type="button" onclick="abrirModalGenerico('cores')">
                                        <i class="fa-solid fa-gear"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- TECIDO -->
                            <div class="col-md-6">
                                <label class="form-label">Tecido</label>
                                <div class="position-relative">
                                    <select id="id_tecidoPedido" multiple></select>
                                    <button class="btn btn-outline-secondary btn-sm position-absolute choice_plus" type="button" onclick="abrirModalGenerico('tecido')">
                                        <i class="fa-solid fa-gear"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- OBSERVAÇÃO -->
                            <div class="col-12">
                                <label class="form-label">Observação</label>
                                <textarea id="observacaoPedido" class="form-control form-control-sm"></textarea>
                            </div>

                            <!-- BOTÕES -->
                            <div class="col-12">
                                <button id="btnSubmitPedido" class="btn btn-sm btn-primary" onclick="cadastrarOuAtualizarPedido()">
                                    <i class="fa-solid fa-plus"></i> Cadastrar
                                </button>

                                <button id="btnCancelarPedido" class="btn btn-sm btn-outline-secondary d-none" onclick="cancelarEdicaoPedido()">
                                    <i class="fa-solid fa-ban"></i> Cancelar
                                </button>
                            </div>

                        </div> <!-- FECHA ROW AQUI -->

                    </div>
                </div>
            </div>

            <div class="table-responsive rounded-1">

                <table class="table table-striped table-hover table-sm">

                    <thead class="table-dark">
                        <tr>
                            <th>Pedido</th>
                            <th>Data</th>
                            <th>Shaper</th>
                            <th>Observação</th>
                            <th width="100">Ações</th>
                        </tr>
                    </thead>

                    <tbody id="listaPedidos"></tbody>

                </table>

            </div>

        </div>
    </div>
</div>
</div>


<!-- MODAL GERENCIADOR COMPOSIÇÃO, VARIAÇÃO, ETC...-->
<div class="modal fade" id="modalGenerico" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Gerenciar Composição</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">

                <!-- FORM -->
                <div class="row g-2 mb-3">
                    <div class="col">
                        <input type="text" id="modalInput" class="form-control form-control-sm" placeholder="Digite a composição">
                    </div>
                    <div class="col-auto">
                        <div class="col-auto">
                            <button id="btnSalvarComposicao" class="btn btn-sm btn-primary" onclick="salvarComposicao()">
                                <i class="fa-solid fa-plus"></i> Cadastrar
                            </button>
                            <button id="btnCancelarComposicao" class="btn btn-sm btn-outline-secondary d-none" onclick="cancelarEdicaoComposicao()">
                                Cancelar
                            </button>
                        </div>
                    </div>
                </div>

                <!-- TABELA -->
                <div class="table-responsive">
                    <table class="table table-sm table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Descrição</th>
                                <th width="120">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="listaComposicoesModal"></tbody>
                    </table>
                </div>

            </div>

        </div>
    </div>
</div>

<!--MODAL EDITAR STATUS-->
<div class="modal fade" id="modalStatus" tabindex="-1">
    <div class="modal-dialog modal-md modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="fa-solid fa-arrows-turn-to-dots"></i> Status do Pedido
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <!-- CAMPOS OCULTOS -->
                <input type="hidden" id="statusPedidoId">
                <input type="hidden" id="statusIndex">
                <input type="hidden" id="statusIdReal"> <!-- 🔥 ESTA LINHA SALVA O STATUS CORRETO -->

                <div class="mb-2">
                    <label class="form-label">Status Sugerido</label>
                    <input type="text" id="statusDescricao" class="form-control form-control-sm" disabled tabindex="-1">
                </div>
                <div class="mb-2">
                    <label class="form-label">Data e Hora</label>
                    <input type="datetime-local" id="statusData" class="form-control form-control-sm">
                </div>
                <div class="mb-2">
                    <label class="form-label">Observação</label>
                    <textarea id="statusObs" class="form-control form-control-sm" rows="3"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-sm btn-primary" onclick="salvarStatusPedido()">
                    <i class="fa-solid fa-floppy-disk"></i> Salvar Status
                </button>
            </div>
        </div>
    </div>
</div>


<!--MODAL EXCLUIR STATUS-->
<div class="modal fade" id="modalStatusExcluir" tabindex="-1">
    <div class="modal-dialog modal-md modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="fa-regular fa-trash-can"></i> Excluir
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <p>Tem certeza que deseja realmente excluir o status do pedido?</p>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Não</button>
                <button type="button" class="btn btn-primary" id="btnConfirmarExcluir">Sim</button>
            </div>

        </div>
    </div>
</div>
